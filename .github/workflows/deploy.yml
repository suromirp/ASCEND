name: Deploy ASCEND to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # De kwaliteitspoort: een rode lint of test stopt de deploy hier, voor
      # er iets gebouwd of live gezet wordt. (De typecontrole zit in
      # `npm run build`, dat `tsc -b` draait.)
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

      # Eén bouwtijd voor de site en voor de zip van de Android-app hieronder.
      - name: Bouwtijd
        run: echo "ASCEND_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - run: npm run build
        env:
          # Derived from the repo's actual GitHub Pages configuration, so
          # this resolves correctly both for a project page
          # (https://<username>.github.io/<repo-name>/) and for a root or
          # custom domain (base_path is empty there).
          ASCEND_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # De live update van de Android-app (docs/beslissingen/2026-11-01-android-app.md): dezelfde
      # code nog eens gebouwd zoals de app hem gebruikt (basis "/", geen service worker), als zip
      # naast de site, met app-versie.json. Dit komt na de build van de site en schrijft alleen in
      # dist/app en dist/app-versie.json; mislukt het, dan gaat de site gewoon live zonder update
      # voor de app.
      - name: Webbuild voor de app als zip
        continue-on-error: true
        env:
          ASCEND_BASE_PATH: /
          ASCEND_TARGET: android
          ASCEND_UPDATE_URL: ${{ steps.pages.outputs.base_url }}/
          ASCEND_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
        run: |
          npx vite build --outDir dist-app --emptyOutDir
          mkdir -p dist/app
          ZIP="dist/app/ascend-web-${GITHUB_SHA::7}.zip"
          (cd dist-app && zip -qr "../$ZIP" .)
          node scripts/app-versie.mjs "$ZIP" dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
